name: Compilar Onda.exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Compilar
        run: |
          python make_icon.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Onda --icon onda.ico --add-data "web;web" --exclude-module cryptography onda.py
      - uses: actions/upload-artifact@v4
        with:
          name: Onda-windows
          path: dist/Onda.exe
      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Onda.exe
          generate_release_notes: true
